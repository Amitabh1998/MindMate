<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Goals and progress illustration">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEF6E7"></stop>
      <stop offset="1" stop-color="#E9F7EF"></stop>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g)"></rect>
  <!-- checklist card -->
  <rect x="90" y="70" width="220" height="130" rx="14" fill="#ffffff" stroke="#C7D2FE" stroke-width="2"></rect>
  <rect x="110" y="100" width="140" height="10" rx="5" fill="#E5E7EB"></rect>
  <rect x="110" y="122" width="120" height="10" rx="5" fill="#E5E7EB"></rect>
  <rect x="110" y="144" width="100" height="10" rx="5" fill="#E5E7EB"></rect>
  <!-- big green check -->
  <circle cx="300" cy="115" r="20" fill="#ECFDF5" stroke="#10B981" stroke-width="3"></circle>
  <path d="M291 115l6 6 12-12" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
  <!-- progress bar -->
  <rect x="90" y="220" width="220" height="8" rx="4" fill="#E5E7EB"></rect>
  <rect x="90" y="220" width="140" height="8" rx="4" fill="#6366F1"></rect>
</svg>
