<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Daily check-in illustration">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"></stop>
      <stop offset="1" stop-color="#ECFEFF"></stop>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"></rect>
  <!-- card -->
  <rect x="60" y="70" width="280" height="130" rx="12" fill="#ffffff" stroke="#CBD5E1" stroke-width="2"></rect>
  <!-- simple line chart -->
  <polyline points="80,180 120,140 150,160 190,125 230,165 260,148 280,158" fill="none" stroke="#6366F1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></polyline>
  <!-- rising sun -->
  <circle cx="110" cy="110" r="12" fill="#FBBF24" opacity="0.9"></circle>
</svg>
